name: Publish

on:
  push:
    tags:
      - "cyclic_tab_bar-v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish cyclic_tab_bar to pub.dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Set up pub.dev OIDC
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze package
        run: flutter analyze

      - name: Test package
        run: flutter test

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze example
        working-directory: example
        run: flutter analyze

      - name: Test example
        working-directory: example
        run: flutter test

      - name: Check tag matches package version
        run: |
          package_version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          expected_tag="cyclic_tab_bar-v${package_version}"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match ${expected_tag}"
            exit 1
          fi

      - name: Publish dry-run
        run: flutter pub publish --dry-run

      - name: Publish
        run: flutter pub publish --force
